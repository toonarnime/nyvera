<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYVERA — Join</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;

  font-family:Arial,sans-serif;
  color:white;

  background:
  radial-gradient(
    circle at 20% 15%,
    #512b79,
    transparent 40%
  ),
  radial-gradient(
    circle at 80% 80%,
    #1d4b78,
    transparent 45%
  ),
  #070511;
}

.box{
  width:100%;
  max-width:430px;

  padding:38px 30px;

  border-radius:30px;

  background:
  rgba(255,255,255,.08);

  border:
  1px solid
  rgba(255,255,255,.16);

  backdrop-filter:
  blur(20px);

  box-shadow:
  0 25px 80px
  rgba(0,0,0,.5);
}

.logo{
  text-align:center;

  font-size:31px;
  font-weight:bold;

  letter-spacing:9px;

  text-shadow:
  0 0 25px
  #a68cff;
}

.tagline{
  text-align:center;

  margin:12px 0 30px;

  color:#c9c3df;

  line-height:1.6;
}

.tabs{
  display:flex;

  padding:5px;

  margin-bottom:25px;

  border-radius:18px;

  background:
  rgba(255,255,255,.06);
}

.tab{
  width:50%;

  padding:12px;

  border:none;

  border-radius:14px;

  color:#bdb6d2;

  background:transparent;

  font-weight:bold;

  cursor:pointer;
}

.tab.active{
  color:white;

  background:
  linear-gradient(
    90deg,
    #735cff,
    #d864bd
  );
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;

  margin:16px 0 7px;

  color:#d8d2e9;

  font-size:13px;
}

input{
  width:100%;

  padding:14px;

  border-radius:14px;

  color:white;

  outline:none;

  background:
  rgba(255,255,255,.07);

  border:
  1px solid
  rgba(255,255,255,.13);
}

input:focus{
  border-color:#a883ff;
}

.submit{
  width:100%;

  margin-top:25px;

  padding:15px;

  border:none;

  border-radius:16px;

  color:white;

  font-weight:bold;

  cursor:pointer;

  background:
  linear-gradient(
    90deg,
    #705cff,
    #dc65bd
  );
}

.message{
  min-height:22px;

  margin-top:15px;

  text-align:center;

  color:#ffc1e6;

  font-size:13px;
}

.home{
  display:block;

  margin-top:25px;

  text-align:center;

  color:#aaa2c2;

  text-decoration:none;

  font-size:13px;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">
NYVERA
</div>

<p class="tagline">
A universe where creators
turn imagination into worlds.
</p>

<div class="tabs">

<button
class="tab active"
onclick="showForm('signup',this)">

CREATE ID

</button>

<button
class="tab"
onclick="showForm('login',this)">

LOG IN

</button>

</div>

<!-- CREATE ID -->

<form
id="signup"
class="form active">

<label>
Choose your NYVERA ID
</label>

<input
id="newUsername"
placeholder="@yourname"
required>

<label>
Email
</label>

<input
id="newEmail"
type="email"
placeholder="you@email.com"
required>

<label>
Create password
</label>

<input
id="newPassword"
type="password"
placeholder="At least 6 characters"
required>

<button
class="submit">

CREATE MY NYVERA ID ✦

</button>

</form>

<!-- LOG IN -->

<form
id="login"
class="form">

<label>
NYVERA ID or email
</label>

<input
id="loginUser"
placeholder="@yourname"
required>

<label>
Password
</label>

<input
id="loginPassword"
type="password"
placeholder="Your password"
required>

<button
class="submit">

LOG IN TO NYVERA ✦

</button>

</form>

<div
id="message"
class="message">
</div>

<a
class="home"
href="world.html">

← Back to Explore

</a>

</div>

<script>

function showForm(
name,
button
){

document
.querySelectorAll(".form")
.forEach(

form =>
form.classList.remove(
"active"
)

);

document
.getElementById(name)
.classList.add(
"active"
);

document
.querySelectorAll(".tab")
.forEach(

tab =>
tab.classList.remove(
"active"
)

);

button.classList.add(
"active"
);

document
.getElementById("message")
.innerText="";

}

/* Create NYVERA ID */

document
.getElementById("signup")
.addEventListener(

"submit",

function(e){

e.preventDefault();

const username=

document
.getElementById(
"newUsername"
)
.value
.trim()
.replace("@","");

const email=

document
.getElementById(
"newEmail"
)
.value
.trim();

const password=

document
.getElementById(
"newPassword"
)
.value;

if(
username.length < 3
){

message.innerText=
"NYVERA ID must have at least 3 characters.";

return;

}

if(
password.length < 6
){

message.innerText=
"Password must have at least 6 characters.";

return;

}

localStorage
.setItem(

"nyveraAccount",

JSON.stringify({

username:username,

email:email,

password:password

})

);

message.innerText=
"✨ NYVERA ID created!";

setTimeout(

function(){

window.location.href=
"profile.html";

},

900

);

}

);

/* Log in */

document
.getElementById("login")
.addEventListener(

"submit",

function(e){

e.preventDefault();

const loginUser=

document
.getElementById(
"loginUser"
)
.value
.trim()
.replace("@","");

const loginPassword=

document
.getElementById(
"loginPassword"
)
.value;

const saved=

localStorage
.getItem(
"nyveraAccount"
);

if(!saved){

message.innerText=
"No NYVERA ID found. Create one first.";

return;

}

const account=
JSON.parse(saved);

if(

(
loginUser !==
account.username

&&

loginUser !==
account.email
)

||

loginPassword !==
account.password

){

message.innerText=
"Incorrect NYVERA ID or password.";

return;

}

message.innerText=
"✨ Welcome back!";

setTimeout(

function(){

window.location.href=
"profile.html";

},

700

);

}

);

</script>

</body>
</html>
